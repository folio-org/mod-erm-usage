version: 2

updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "sunday"
    open-pull-requests-limit: 10
    ignore:
      # Versions are pinned by raml-module-builder and must be aligned manually
      # when bumping it, see the comments in pom.xml
      - dependency-name: "io.vertx:*"
      - dependency-name: "org.aspectj:*"
    commit-message:
      prefix: fix
      prefix-development: chore
      include: scope
    groups:
      folio-deps:
        patterns:
          - "org.folio:*"
          - "org.olf:*"
      prod-deps:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "org.folio:*"
          - "org.olf:*"
      test-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
        exclude-patterns:
          - "org.folio:*"
          - "org.olf:*"
